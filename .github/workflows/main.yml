name: Build Tests

on:
  push:
    branches:
      - main
      - develop
      - gh-workflows
  pull_request:
    branches:
      - main
      - develop

env:
  PLATFORM: posix
  TESTS: yes

jobs:
  build-linux-autotools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        CC: ["gcc", "clang" ]
    steps:
      - uses: actions/checkout@v6
      - name: setup
        run: |
          sudo apt-get update && sudo apt-get install -y libcunit1-dev libtool libtool-bin exuberant-ctags valgrind
          ./autogen.sh
      - name: configure
        run: |
          # mkdir build-${{matrix.CC}}
          # cd build-${{matrix.CC}}
          $GITHUB_WORKSPACE/configure --enable-tests
      - name: compile
        run: |
          # cd build-${{matrix.CC}}
          make EXTRA_CFLAGS=-Werror
      - name: tests
        run: |
          # cd build-${{matrix.CC}}
          libtool --mode=execute valgrind --track-origins=yes --leak-check=yes --show-reachable=yes --error-exitcode=123 --quiet tests/unit-tests/testdriver
          libtool --mode=execute valgrind --track-origins=yes --leak-check=yes --show-reachable=yes --error-exitcode=123 --quiet tests/ccm-test

  build-linux-cmake:
    name: Build for Linux using CMake
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build tinydtls
      run: |
        cmake -E make_directory build_test
        cd build_test
        cmake -DWARNING_TO_ERROR=ON -Dmake_tests=ON ..
        cmake --build .
  build-macos-cmake:
    name: Build for macOS using CMake
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build tinydtls
      run: |
        cmake -E make_directory build_test
        cd build_test
        cmake -DWARNING_TO_ERROR=ON -Dmake_tests=ON ..
        cmake --build .

  build-windows:
    name: Build for Windows using CMake
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build tinydtls
      run: |
        cmake -E make_directory build_test
        cd build_test
        cmake -G "Unix Makefiles" -DWARNING_TO_ERROR=ON ..
        cmake --build .

  mingw-cmake:
    runs-on: windows-latest
    strategy:
      matrix:
        OS: ["UCRT64", "CLANG64"]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - name: Environment Setup
        shell: bash
        run: |
          if [ "${{matrix.OS}}" = "UCRT64" ]; then
            mingw_var="ucrt-x86_64"
          elif [ "${{matrix.OS}}" = "CLANG64" ]; then
            mingw_var="clang-x86_64"
          else
            echo "Unsupported MinGW variant: ${{matrix.OS}}"
            mingw_var=""
          fi
          echo "MINGW_VARIANT=${mingw_var}" >> $GITHUB_ENV
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.OS}}
          update: true
          install: git mingw-w64-${{env.MINGW_VARIANT}}-gcc mingw-w64-${{env.MINGW_VARIANT}}-cmake mingw-w64-${{env.MINGW_VARIANT}}-openssl
      - name: MinGW ${{matrix.OS}} build
        run: |
          echo 'Running in MSYS2 ${{matrix.OS}}!'
          cmake -E remove_directory build
          cmake -E make_directory build
          cd build
          cmake .. -DWARNING_TO_ERROR=ON
          cmake --build .
          cmake --build . -- install
